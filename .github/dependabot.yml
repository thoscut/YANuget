version: 2
updates:
  # Cargo dependencies. This is a package server, so a known-vulnerable
  # dependency is not merely a hygiene problem — `cargo audit` runs in CI and
  # these updates are what keep it quiet.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are almost always mechanical; batching them keeps
      # the queue readable and leaves majors as individual, reviewable PRs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # sqlx 0.9 requires rustc 1.94 — six minor versions past this crate's
      # declared MSRV of 1.88. Taking it is not a dependency decision, it is a
      # decision to drop every toolchain between the two, and that belongs in a
      # release rather than in a routine bump. The 0.9 API change it brings (SQL
      # strings must be `&'static str` or explicitly asserted) has already been
      # prepared for: the query builders are compile-time constants and the
      # three interpolating call sites take `&'static str` only.
      #
      # Scoped to the 0.9 majors, so 0.8.x patches — the ones that would carry a
      # security fix — still arrive.
      - dependency-name: sqlx
        versions: [">=0.9.0"]

  # Every action in the workflows is pinned to a full commit SHA with its
  # release in a trailing comment (`@<sha> # v7.0.1`). Dependabot understands
  # that form and proposes the new SHA and comment together, which is what
  # keeps the pins from turning into a reason not to update.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain`'s refs are not versions of the action: its
      # branches are named after the toolchain they install, which is how
      # Dependabot once "upgraded" the MSRV job's `@1.88.0` to `@1.100.0`. It
      # is now pinned to a commit of its master branch, with the toolchain
      # given as `toolchain:`, and that commit has no release for Dependabot
      # to track. Bump it by hand; it is a thin wrapper around rustup.
      - dependency-name: dtolnay/rust-toolchain

  # The docs toolchain (requirements-docs.in, compiled into the hashed
  # requirements-docs.txt) runs in the release builds and the image build.
  # Dependabot recompiles the lock, hashes included.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      docs-toolchain:
        patterns: ["*"]

  # The media capture's Python (Pillow) and npm (Playwright) dependencies.
  - package-ecosystem: pip
    directory: /scripts/media
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /scripts/media
    schedule:
      interval: monthly

  # Both base images in the Dockerfile are pinned by digest as well as tag;
  # this is what moves the digests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Same trap as `dtolnay/rust-toolchain` above: `rust:1.88-slim-trixie`
      # does not name a version of a dependency, it declares the crate's MSRV.
      # The builder stage is pinned there on purpose so the image build
      # re-checks that the crate still compiles at its floor, and it is raised
      # by hand together with `rust-version` in Cargo.toml. Taking a bump here
      # would silently retire that check. Only the tag's version is ignored: a
      # new digest for the same tag (a rebuilt image) is still proposed.
      #
      # `debian` — the runtime base, and the only layer that actually ships —
      # is deliberately not ignored, so the released image keeps getting its
      # security updates.
      - dependency-name: rust
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
