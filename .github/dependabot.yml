version: 2
updates:
  # Cargo dependencies. This is a package server, so a known-vulnerable
  # dependency is not merely a hygiene problem — `cargo audit` runs in CI and
  # these updates are what keep it quiet.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps are almost always mechanical; batching them keeps
      # the queue readable and leaves majors as individual, reviewable PRs.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # sqlx 0.9 requires rustc 1.94 — six minor versions past this crate's
      # declared MSRV of 1.88. Taking it is not a dependency decision, it is a
      # decision to drop every toolchain between the two, and that belongs in a
      # release rather than in a routine bump. The 0.9 API change it brings (SQL
      # strings must be `&'static str` or explicitly asserted) has already been
      # prepared for: the query builders are compile-time constants and the
      # three interpolating call sites take `&'static str` only.
      #
      # Scoped to the 0.9 majors, so 0.8.x patches — the ones that would carry a
      # security fix — still arrive.
      - dependency-name: sqlx
        versions: [">=0.9.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # `dtolnay/rust-toolchain@1.88.0` does not name a version of the action —
      # that ref *is* the toolchain the action installs, and it is pinned to the
      # crate's MSRV on purpose. Dependabot cannot tell the two apart and
      # "upgraded" it to 1.100.0, which would have left a job still called
      # "Minimum supported Rust (1.88)" installing Rust 1.100 and checking
      # nothing. It failed loudly that time; a version that existed would have
      # passed and been worse.
      - dependency-name: dtolnay/rust-toolchain

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Same trap as `dtolnay/rust-toolchain` above: `rust:1.88-slim` does not
      # name a version of a dependency, it declares the crate's MSRV. The
      # builder stage is pinned there on purpose so the image build re-checks
      # that the crate still compiles at its floor, and it is raised by hand
      # together with `rust-version` in Cargo.toml. Taking a bump here would
      # silently retire that check.
      #
      # `debian` — the runtime base, and the only layer that actually ships —
      # is deliberately not ignored, so the released image keeps getting its
      # security updates.
      - dependency-name: rust
