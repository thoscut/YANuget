name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Build a static-ish release binary per target and upload it as an artifact.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Render and embed the offline documentation site before compiling, so the
      # release binary ships the full docs at /docs on every target.
      - name: Build documentation site
        shell: bash
        run: |
          pip install -r requirements-docs.txt
          mkdocs build
          # HTML/CSS must reference no external asset hosts (offline guarantee).
          if grep -rEiq --include="*.html" --include="*.css" \
              "https?://[a-z0-9.-]*(fonts\.|gstatic|googleapis|cdn\.|unpkg|jsdelivr|cdnjs)" site/; then
            echo "::error::Built docs site references external asset hosts (not offline-safe)"
            exit 1
          fi

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          bin="yanuget${{ matrix.ext }}"
          src="target/${{ matrix.target }}/release/$bin"
          name="yanuget-${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z a "dist/$name.zip" "./$src" ./README.md ./LICENSE
          else
            tar -czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" "$bin" -C "$GITHUB_WORKSPACE" README.md LICENSE
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanuget-${{ matrix.target }}
          path: dist/*

  # Collect all built artifacts and publish a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
