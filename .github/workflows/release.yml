name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Nothing is built before the tag and the manifest agree. A release whose
  # binaries report a different version than the tag they are attached to is
  # worse than a failed release: it is wrong in a way nobody notices for months.
  guard:
    name: Check tag matches Cargo.toml
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi
          echo "releasing $tag from Cargo.toml version $version"

  # Build a release binary per target and upload it as an artifact.
  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker (aarch64 linux)
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Render and embed the offline documentation site before compiling, so the
      # release binary ships the full docs at /docs on every target.
      - name: Build documentation site
        shell: bash
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
          # HTML/CSS must reference no external asset hosts (offline guarantee).
          if grep -rEiq --include="*.html" --include="*.css" \
              "https?://[a-z0-9.-]*(fonts\.|gstatic|googleapis|cdn\.|unpkg|jsdelivr|cdnjs)" site/; then
            echo "::error::Built docs site references external asset hosts (not offline-safe)"
            exit 1
          fi

      # `--locked` so the released binary is built from the dependency versions
      # in Cargo.lock, not from whatever resolved that morning.
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          bin="yanuget${{ matrix.ext }}"
          name="yanuget-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist "staging/$name"
          # Stage everything first so the archive has one flat directory in it,
          # rather than the build tree's path. `7z` in particular stores paths
          # exactly as given.
          cp "target/${{ matrix.target }}/release/$bin" "staging/$name/"
          cp README.md LICENSE CHANGELOG.md yanuget.example.toml "staging/$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            (cd staging && 7z a "../dist/$name.zip" "$name")
          else
            tar -czf "dist/$name.tar.gz" -C staging "$name"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanuget-${{ matrix.target }}
          path: dist/*

  # Publish a container image to the GitHub Container Registry.
  image:
    name: Publish container image
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.guard.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.guard.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # A released image must carry the real documentation, not the
          # placeholder — which is indistinguishable from success until someone
          # opens /docs.
          build-args: REQUIRE_DOCS=1
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Collect all built artifacts and publish a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum yanuget-* > SHA256SUMS

      # The changelog section for this version becomes the top of the release
      # notes; GitHub's generated commit list is appended below it.
      - name: Extract changelog section
        shell: bash
        run: |
          set -euo pipefail
          awk -v v="${{ needs.guard.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          files: dist/*

  # Publish to crates.io, if the repository has a token configured. Without one
  # the step is skipped, so the rest of the release still completes.
  crates-io:
    name: Publish to crates.io
    needs: [guard, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `secrets` is not available to a job-level `if`, so the gate lives here.
      # Note the published crate embeds the placeholder docs page rather than the
      # rendered site: `site/` is generated, so it is not part of the package,
      # and `/docs` on a `cargo install`ed binary links to the online copy.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked
