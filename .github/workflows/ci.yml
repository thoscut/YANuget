name: CI

on:
  # Branches other than `main` are checked through their pull request; a
  # push trigger on them as well ran every job twice for each push to an open
  # pull request. `workflow_dispatch` runs CI on a branch that has none.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so an advisory published against something already in Cargo.lock
  # is reported in a week nobody pushes, and a new stable toolchain that breaks
  # the build is found before the next change is blamed for it.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  # The release workflow runs this whole workflow against the commit it is
  # about to publish, and publishes nothing unless every job here passes. It
  # passes that commit as `ref`; every other trigger leaves it empty and each
  # checkout takes the event's own commit.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to check out and test"
        required: true
        type: string

# Nothing here writes to the repository. Every job runs code from the pull
# request (build scripts, proc macros, the docs toolchain), so the token it
# holds should be able to read and nothing more.
permissions:
  contents: read

# A newer push to the same pull request makes the older run moot. Pushes to
# `main` are left to finish, so every commit there keeps a result. The group
# is named literally rather than after `github.workflow`: called from the
# release workflow, that is the caller's name, and sharing the caller's group
# would leave this run waiting on the run that is waiting on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Every action is pinned to a full commit SHA, with the release it corresponds
# to in a comment: a tag can be moved to other code, a SHA cannot. Dependabot
# (github-actions ecosystem) proposes the updates. `dtolnay/rust-toolchain` is
# pinned to a commit of its master branch, which has no release tags, and names
# the toolchain explicitly with `toolchain:`.
#
# Caches are keyed per job and per compiler (`cachekey` is a hash of the rustc
# version), so a new stable release starts a fresh `target/` instead of
# restoring one full of artifacts it cannot use, and no job's restore prefix
# matches another job's cache. When the release workflow calls this one
# (`inputs.ref` is set) nothing is restored: a release is checked from a clean
# state, as it is built.
jobs:
  test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        if: ${{ !inputs.ref }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-${{ steps.toolchain.outputs.cachekey }}-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      # Build the documentation site so it is embedded into the binary, and
      # enforce the offline guarantee: the built site must reference no external
      # asset hosts (fonts/CDNs). Done before any cargo step that compiles.
      - name: Build documentation site
        run: |
          # The lock pins and hashes every package, so this installs exactly
          # the reviewed set rather than whatever PyPI serves today.
          pip install --require-hashes -r requirements-docs.txt
          # `--strict` so a broken cross-reference fails here rather than 404ing
          # for someone reading the docs the binary serves.
          mkdocs build --strict
          # Enforce offline: HTML/CSS (the files that *declare* loaded resources)
          # must reference no external asset hosts. JS bundles are served locally,
          # so substrings inside them (e.g. UMD comments) are not flagged.
          if grep -rEiq --include="*.html" --include="*.css" \
              "https?://[a-z0-9.-]*(fonts\.|gstatic|googleapis|cdn\.|unpkg|jsdelivr|cdnjs)" site/; then
            echo "::error::Built docs site references external asset hosts (not offline-safe)"
            grep -rEi --include="*.html" --include="*.css" \
              "https?://[a-z0-9.-]*(fonts\.|gstatic|googleapis|cdn\.|unpkg|jsdelivr|cdnjs)" site/ || true
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      # The prelude's end-to-end test runs the generated PowerShell with
      # `pwsh`, which the Ubuntu image ships, and skips itself where there is
      # none. Here a missing `pwsh` fails it instead
      # (`YANUGET_REQUIRE_PWSH`): otherwise the image dropping PowerShell
      # would leave every check green with no prelude code run. The version
      # step says up front which one ran, or that there is none.
      - name: PowerShell for the prelude test
        run: pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Test
        env:
          YANUGET_REQUIRE_PWSH: "1"
        run: cargo test --workspace --all-features --locked

      # On crates.io `yanuget-pkg` comes without its `net` feature, which the
      # workspace always turns on (by `--all-features` above, and by feature
      # unification). This is the only run of its tests as it is published.
      - name: Test yanuget-pkg without default features
        run: cargo test -p yanuget-pkg --no-default-features --locked

      # A broken intra-doc link is a dead link on docs.rs; `yanuget-pkg` is
      # meant to be published there.
      - name: Documentation lints
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --locked

      # The tests too slow or too large for every push (a 5 GiB zip entry
      # streamed in constant memory) run on the weekly schedule.
      - name: Ignored tests
        if: github.event_name == 'schedule'
        run: cargo test --workspace --all-features --locked --release -- --ignored

      - name: Build release
        run: cargo build --release --locked

  msrv:
    name: Minimum supported Rust (1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # rust-toolchain.toml pins `stable`; an explicit `+1.89.0` on the command
      # line overrides it so this job really exercises the declared MSRV.
      # (1.89 is the floor required by transitive deps, e.g. uuid 1.27.)
      - name: Install Rust 1.89.0
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.89.0

      - name: Cache cargo
        if: ${{ !inputs.ref }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-${{ steps.toolchain.outputs.cachekey }}-

      # The tests run here, not just a `check`: the container image is built
      # with 1.89, so this is the compiler the image ships, and a behaviour
      # difference between it and stable would otherwise go unnoticed.
      - name: Test against MSRV
        env:
          YANUGET_REQUIRE_PWSH: "1"
        run: cargo +1.89.0 test --workspace --all-targets --all-features --locked

  # The release binaries are also built for Windows and macOS, and the code
  # has `cfg(not(unix))` branches (file permissions, the inbox, storage) that
  # the Linux jobs never compile. A check here finds a break in them on the
  # pull request instead of at tag time. `check` rather than `test`: it covers
  # every target, tests included, at a fraction of the runner minutes.
  portability:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        if: ${{ !inputs.ref }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-${{ steps.toolchain.outputs.cachekey }}-

      # No docs site: the build script embeds its placeholder, which is all a
      # check needs.
      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # Exact versions: the action is pinned, but without one it installs
      # whatever was released last, and a new release that reads the config
      # differently would turn CI red with no change here. Dependabot does not
      # see these; bump them by hand.
      - name: Install cargo-audit and cargo-deny
        id: tools
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2

      # `--deny yanked`: cargo-audit only warns about a yanked crate in the
      # lockfile, and a yank is often how a broken or compromised release is
      # withdrawn, so it fails the job like an advisory does.
      #
      # RUSTSEC-2026-0459 (bundled SQLite before 3.54.0 returns uninitialized
      # page-cache memory when a database is opened with a crafted sibling
      # `-wal` of another page size) is fixed in libsqlite3-sys 0.39, which no
      # sqlx release accepts yet (0.8 pins ^0.30, 0.9 caps it below 0.38).
      # YANuget opens only its own database in `data_dir` and its snapshot in
      # a backup directory; `restore` copies just the backup's `yanuget.db`
      # and deletes any `-wal` next to the live file before opening it, and
      # `backup` opens its snapshot only in a private directory of its own.
      # Writing a `-wal` there already needs write
      # access to the data directory, which owns the server anyway. Ignored,
      # as decided by the maintainer on 2026-11-16, until sqlx allows
      # libsqlite3-sys >= 0.39 (ROADMAP `DEP-14`).
      - name: Audit dependencies for known vulnerabilities
        run: cargo audit --deny yanked --ignore RUSTSEC-2026-0459

      # The ignore of RUSTSEC-2026-0459 has to go once an sqlx release
      # accepts libsqlite3-sys >= 0.39, and nothing else would say so:
      # Dependabot proposes no sqlx 0.9 (dependabot.yml), and the audit is
      # green while the ignore stands. So the weekly run asks the registry. A
      # scratch crate that wants sqlx and libsqlite3-sys >= 0.39 together
      # resolves only when such a release exists (the two cannot both link
      # SQLite in different versions), and then this step fails and says
      # what to do. Pull requests skip it: the answer does not depend on them.
      # So does a release (`inputs.ref` set): called from release.yml,
      # `github.event_name` is the caller's event, and a release started by
      # hand is `workflow_dispatch` too. A fix arriving upstream must not stop
      # an urgent release; the weekly run reports it.
      - name: Is an sqlx release with the fix for RUSTSEC-2026-0459 out?
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && !inputs.ref && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/sqlx-probe"
          mkdir -p "$probe/src"
          touch "$probe/src/lib.rs"
          cat > "$probe/Cargo.toml" <<'EOF'
          [package]
          name = "sqlx-probe"
          version = "0.0.0"
          edition = "2021"
          publish = false

          [dependencies]
          sqlx = { version = ">=0.8", default-features = false, features = ["sqlite"] }
          libsqlite3-sys = ">=0.39"

          [workspace]
          EOF
          if cargo generate-lockfile --manifest-path "$probe/Cargo.toml" 2>"$probe/err"; then
            found=$(awk '/^name = "(sqlx-sqlite|libsqlite3-sys)"$/ { n = $3; getline; print n, $3 }' "$probe/Cargo.lock" | tr -d '"' | paste -sd ' ')
            echo "::error::An sqlx release accepts libsqlite3-sys >= 0.39 ($found). Update sqlx, then drop --ignore RUSTSEC-2026-0459 and close ROADMAP DEP-14."
            exit 1
          elif grep -q 'failed to select a version' "$probe/err"; then
            echo "No sqlx release accepts libsqlite3-sys >= 0.39 yet; the ignore of RUSTSEC-2026-0459 stays (ROADMAP DEP-14)."
          else
            # Not an answer (the registry did not respond): say so, red.
            cat "$probe/err"
            exit 1
          fi

      # Licenses, sources and duplicate crates, as set out in deny.toml. A
      # dependency under a license nobody has looked at, or from a git
      # repository or another registry, fails here rather than in a release.
      #
      # This and the bill of materials below run after a failed audit too
      # (`!cancelled()` instead of the default `success()`): an advisory stays
      # red until someone fixes or ignores it, and a pull request merged in
      # that time would otherwise bring in a license or source nobody
      # checked. The failed audit step still fails the job.
      - name: Check licenses and sources
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: cargo deny check licenses bans sources

      # The release attaches this bill of materials; generating it here finds
      # a tool or metadata problem on the pull request rather than at tag time.
      - name: Install cargo-cyclonedx
        id: cyclonedx
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate the software bill of materials
        if: ${{ !cancelled() && steps.cyclonedx.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --target all \
            --all-features --override-filename yanuget-ci.cdx
          jq -e '.metadata.component.name == "yanuget" and (.components | length) > 100' \
            yanuget-ci.cdx.json >/dev/null

  # Line coverage of the whole test suite, as a summary on the run and an
  # lcov file to download. Nothing gates on the number: it shows what the tests
  # leave out, and a change that drops it says so in the summary. Not run when
  # the release workflow calls this one; a release needs the tests, not the
  # report.
  coverage:
    name: Coverage
    if: ${{ !inputs.ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-${{ steps.toolchain.outputs.cachekey }}-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1

      # No docs site: the build script embeds its placeholder, which the tests
      # do not mind.
      - name: Measure coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
          {
            echo '### Line coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the lcov report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

  package:
    # The release path is not the same as the build path: `cargo publish`
    # packages a tarball from a clean checkout and rebuilds it in isolation, and
    # the container image builds from a context that has no `site/` and no
    # network guarantee. Both have broken while `cargo build` stayed green, so
    # both are checked on every push rather than discovered at tag time.
    name: Packaging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        if: ${{ !inputs.ref }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-package-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-package-${{ steps.toolchain.outputs.cachekey }}-

      # Deliberately without a docs site present: this is how crates.io builds
      # it, and it is what caught `build.rs` writing outside `OUT_DIR`.
      # `--workspace` packages `yanuget-pkg` too and builds `yanuget` against
      # that tarball rather than the path, as crates.io would.
      # The dry run serves `yanuget-pkg` from a local registry under a version
      # number that does not change between commits, and cargo treats a
      # registry crate as immutable: a cached extraction or build of an earlier
      # commit's tarball would stand in for this one's. Both are dropped first.
      - name: Verify the crates package and build from their tarballs
        run: |
          rm -rf ~/.cargo/registry/src/*/yanuget-pkg-*
          cargo clean -p yanuget-pkg
          cargo publish --dry-run --locked --workspace

      # REQUIRE_DOCS=1 matches how the release workflow builds it, so a docs
      # failure is a build failure here rather than an image that quietly ships
      # the "documentation not bundled" placeholder.
      - name: Build the container image
        run: docker build --build-arg REQUIRE_DOCS=1 -t yanuget:ci .

      - name: Container starts, reports healthy and serves the real docs
        run: |
          set -euo pipefail
          docker run -d --name yanuget-ci -p 5000:5000 \
            -e YANUGET_API_KEY=ci-key yanuget:ci
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' yanuget-ci)
            [ "$state" = healthy ] && break
            [ "$state" = unhealthy ] && break
            sleep 2
          done
          docker logs yanuget-ci
          [ "$(docker inspect -f '{{.State.Health.Status}}' yanuget-ci)" = healthy ]
          curl -fsSk https://127.0.0.1:5000/v3/index.json >/dev/null
          if curl -fsSk https://127.0.0.1:5000/docs/ | grep -q "Documentation not bundled"; then
            echo "::error::the image embedded the placeholder docs page"
            exit 1
          fi
          docker rm -f yanuget-ci

      # The image's binary is built with `cargo auditable`: its dependency
      # tree is embedded in a `.dep-v0` section for scanners to read.
      - name: The image's binary carries its dependency tree
        run: |
          set -euo pipefail
          id=$(docker create yanuget:ci)
          docker cp "$id:/usr/local/bin/yanuget" ./yanuget-image
          docker rm "$id"
          objdump -h ./yanuget-image | grep -q '\.dep-v0'

  client-compat:
    # The Rust tests drive the server with `reqwest` — a faithful HTTP client,
    # but not a NuGet client. It does not care whether the service index
    # advertises the resources NuGet probes for, whether the flat container
    # lists a version NuGet is about to restore, or whether a symbol key
    # matches what a debugger computes. Real defects have hidden behind a green
    # test suite for exactly that reason, including one where unlisting a
    # package broke every build pinned to it.
    #
    # So this job runs the real toolchain against a real TLS server. The
    # GitHub-hosted Ubuntu image already ships a .NET SDK, so `setup-dotnet`
    # only pins the version — nothing large is downloaded.
    name: NuGet client compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache cargo
        if: ${{ !inputs.ref }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-compat-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-compat-${{ steps.toolchain.outputs.cachekey }}-

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Build the server
        run: cargo build --release --locked

      - name: Push, restore, build and run with the real client
        env:
          WORK_DIR: ${{ runner.temp }}/yanuget-compat
        run: scripts/verify-with-dotnet.sh "$WORK_DIR"
