name: Refresh product media

# The screenshots and GIFs on the README are generated from the running server,
# so they go stale the moment the gallery changes — and a stale screenshot is
# worse than none, because it is believed.
#
# Manual runs regenerate and open a pull request. Pushes that touch the UI or
# the docs regenerate too, and *fail* if the result differs from what is
# committed: that turns "the media is out of date" into a visible signal
# instead of something nobody notices for months. The fix is one click on the
# manual run.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/web/ui.rs"
      - "src/web/mod.rs"
      - "scripts/media/**"
      - "scripts/capture-media.sh"
      - "docs/**"
      - "mkdocs.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Regenerate screenshots and GIFs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-media-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-media-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The embedded docs page is one of the screenshots, so the site has to be
      # real rather than the placeholder.
      - name: Build documentation site
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict

      - name: Capture
        run: scripts/capture-media.sh

      - name: Report what changed
        id: diff
        run: |
          if git diff --quiet -- .github/media; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed media already matches what the server renders."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- .github/media
          fi

      # A manual run is someone asking for an update, so it produces one.
      - name: Open a pull request
        if: github.event_name == 'workflow_dispatch' && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: .github/media
          branch: chore/refresh-media
          delete-branch: true
          commit-message: "Refresh the product screenshots and walkthrough GIFs"
          title: "Refresh the product screenshots and walkthrough GIFs"
          body: |
            Regenerated by `scripts/capture-media.sh` against a server built
            from this commit. Every image here is what the code actually
            renders — review the diff as you would a UI change, because that is
            what it is.

      # A push is not, so it only says so, loudly.
      - name: Fail if the committed media is stale
        if: github.event_name == 'push' && steps.diff.outputs.changed == 'true'
        run: |
          echo "::error::The gallery changed but .github/media did not. Run the \
          'Refresh product media' workflow (or scripts/capture-media.sh) to update it."
          exit 1

      # Either way, the freshly captured media is downloadable from the run.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-media
          path: .github/media
