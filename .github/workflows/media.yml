name: Refresh product media

# The screenshots and GIFs on the README are generated from the running server,
# so they go stale the moment the gallery changes — and a stale screenshot is
# worse than none, because it is believed.
#
# Any run that finds the committed media out of date opens a pull request with
# the new captures. It deliberately does *not* fail the build on a difference:
# these are screenshots rendered by a headless browser, and a GitHub runner will
# not produce byte-identical PNGs to a developer's machine — different font
# packages, different Chromium build, different subpixel rounding. A byte
# comparison would therefore go red on the first push after merge and stay red,
# which trains everyone to ignore it. A pull request someone can look at is the
# honest signal.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/web/ui.rs"
      - "src/web/mod.rs"
      - "scripts/media/**"
      - "scripts/capture-media.sh"
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"

# Read-only unless a job says otherwise. Capturing runs a lot of third-party
# code — npm packages, Pillow, Playwright's browser, the docs toolchain, every
# crate's build script — so it gets no write access at all; the job that
# pushes runs none of it.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Regenerate screenshots and GIFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      # No cargo cache. This job runs npm packages and a browser, and a cache
      # it saved on `main` would be restored by CI's jobs, whose restore keys
      # match any `cargo-` prefix. It runs rarely enough to build cold.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # The embedded docs page is one of the screenshots, so the site has to be
      # real rather than the placeholder.
      - name: Build documentation site
        run: |
          pip install --require-hashes -r requirements-docs.txt
          mkdocs build --strict

      # Installs Pillow from its hashed lock and Playwright with `npm ci` from
      # package-lock.json, so the capture runs the reviewed versions.
      - name: Capture
        run: scripts/capture-media.sh

      - name: Report what changed
        id: diff
        run: |
          if git diff --quiet -- .github/media; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The committed media already matches what the server renders."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- .github/media
          fi

      # The hand-over to `publish`, and downloadable from the run either way.
      - name: Upload the captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-media
          path: .github/media
          if-no-files-found: error

  # Pushes the captures and opens the pull request. It checks out the same
  # commit, swaps in the images from the artifact and commits them; nothing
  # from the capture job runs here, and only the pinned actions below do.
  publish:
    name: Open a pull request with the captures
    needs: capture
    if: needs.capture.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the captures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-media
          path: .github/media

      # `continue-on-error`, because opening the pull request needs the
      # repository's "Allow GitHub Actions to create and approve pull requests"
      # setting, which this workflow cannot turn on and should not depend on.
      # The branch is pushed either way, so the captures are never lost — the
      # step below says where they are.
      - name: Open a pull request
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: .github/media
          branch: chore/refresh-media
          delete-branch: true
          commit-message: "Refresh the product screenshots and walkthrough GIFs"
          title: "Refresh the product screenshots and walkthrough GIFs"
          body: |
            Regenerated by `scripts/capture-media.sh` against a server built
            from this commit. Every image here is what the code actually
            renders — review the diff as you would a UI change, because that is
            what it is.

      - name: Say where the refreshed captures are
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
        run: |
          if [ "$PR_OUTCOME" = success ]; then
            echo "::notice::A pull request with the refreshed captures is open."
          else
            echo "::notice::Captures pushed to the 'chore/refresh-media' branch. \
          Opening the pull request needs the repository setting 'Allow GitHub \
          Actions to create and approve pull requests'; until that is on, open \
          it by hand: $REPO_URL/compare/chore/refresh-media?expand=1"
          fi
          echo "Some of the difference is this runner rendering differently from \
          the machine that last committed them — review rather than merge blind."
