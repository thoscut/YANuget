[package]
name = "yanuget"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "YANuget — Yet Another NuGet server. A fast, streaming NuGet V3 server written in Rust, reimplementing BaGetter."
license = "MIT"
repository = "https://github.com/thoscut/yanuget"
readme = "README.md"
keywords = ["nuget", "server", "package", "registry"]
categories = ["web-programming::http-server"]
default-run = "yanuget"

[lib]
name = "yanuget"
path = "src/lib.rs"

[[bin]]
name = "yanuget"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs", "limit"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
futures = "0.3"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
mime = "0.3"
percent-encoding = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
