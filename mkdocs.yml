site_name: YANuget
site_description: A fast, streaming NuGet v3 server — offline documentation.
# No site_url: keep generated links relative so the site works when embedded and
# served under /docs (and under any reverse-proxy path base or feed prefix).
docs_dir: docs
site_dir: site
use_directory_urls: true

# IMPORTANT: this site is embedded into the YANuget binary and must work fully
# offline. `font: false` disables Google Fonts; do NOT enable the social or
# analytics features (they fetch remote assets). A CI check greps the built
# site/ for external asset URLs.
theme:
  name: material
  font: false
  # The gallery's look: its taped-box mark (overrides/.icons), its favicon, and
  # its palette and typeface, remapped onto Material's variables in
  # docs/stylesheets/extra.css. Light or dark follows the browser, as the
  # gallery does, with Material's switch to override it.
  custom_dir: overrides
  icon:
    logo: yanuget/box
  favicon: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - HTTP API: api.md
  - Configuration: configuration.md
  - Deployment: deployment.md
  - Bulk migration: migrate.md
  - Architecture: architecture.md
  - Large packages: large-packages.md
