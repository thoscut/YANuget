# YANuget example configuration.
#
# Copy to `yanuget.toml` and pass with `--config yanuget.toml`, or set the
# matching `YANUGET_*` environment variables (which override this file).

# Interface and port to listen on.
host = "0.0.0.0"            # YANUGET_HOST
port = 5000                # YANUGET_PORT

# Externally visible base URL. Leave unset to derive it per-request from the
# Host / X-Forwarded-* headers (recommended behind a reverse proxy).
# base_url = "https://nuget.example.com"   # YANUGET_BASE_URL

# Where all server data lives. The package store and SQLite database default to
# subpaths of this directory unless overridden below.
data_dir = "./data"        # YANUGET_DATA_DIR
# storage_path = "./data/packages"        # YANUGET_STORAGE_PATH
# database_path = "./data/yanuget.db"     # YANUGET_DATABASE_PATH

# API key required to push and delete packages. STRONGLY recommended.
# If unset, those endpoints are unauthenticated.
# api_key = "change-me"    # YANUGET_API_KEY

# Additional accepted push/delete keys (e.g. one per team or developer). Any of
# these — or api_key — authenticates a write. The env var is comma-separated.
# api_keys = ["alice-key", "bob-key"]   # YANUGET_API_KEYS="alice-key,bob-key"

# Admin key protecting the /admin area, where you can disable, re-enable or
# delete individual package versions via the browser (HTTP Basic auth — any
# username, this key as the password). When unset, the admin area is disabled.
# admin_api_key = "change-me-too"   # YANUGET_ADMIN_API_KEY

# Number of packages shown per gallery page (overridable per request with ?take=).
gallery_page_size = 20     # YANUGET_GALLERY_PAGE_SIZE

# Maximum accepted upload size in bytes. Unset = unlimited (YANuget streams
# uploads straight to disk, so 25 GiB+ packages work without extra memory).
# 26843545600 = 25 GiB.
# max_package_size_bytes = 26843545600    # YANUGET_MAX_PACKAGE_SIZE_BYTES

# Whether re-pushing an existing id/version overwrites it. Off by default to
# preserve NuGet's immutability guarantee. Accepts a bool or a string:
#   false  — never overwrite (default)
#   true   — overwrite any version
#   "prerelease-only" — overwrite pre-releases only; stable releases stay immutable
allow_overwrite = false    # YANUGET_ALLOW_OVERWRITE (false|true|prerelease-only)

# When true, DELETE hard-deletes a package. When false (default), DELETE only
# unlists it (the NuGet client's "delete" semantics), keeping it restorable.
hard_delete_enabled = false   # YANUGET_HARD_DELETE_ENABLED

# TLS. On by default: YANuget serves HTTPS. If no certificate is configured, a
# self-signed one is generated and cached under {data_dir}/tls (clients must be
# told to trust it). Provide your own PEM cert + key for a trusted certificate,
# or set tls_enabled = false to serve plain HTTP behind a TLS-terminating proxy.
tls_enabled = true            # YANUGET_TLS_ENABLED
# tls_cert_path = "/etc/yanuget/cert.pem"   # YANUGET_TLS_CERT_PATH
# tls_key_path  = "/etc/yanuget/key.pem"    # YANUGET_TLS_KEY_PATH

# Symbol server: accept `.snupkg` pushes at /api/v2/symbol and serve PDBs over
# the SSQP path /download/symbols/{file}/{key}/{file}. Enabled by default.
enable_symbol_server = true   # YANUGET_ENABLE_SYMBOL_SERVER

# Human-facing web gallery at `/` and `/packages/...`. Enabled by default.
enable_web_ui = true          # YANUGET_ENABLE_WEB_UI

# Which client's install command the gallery shows first on a package page.
# One of "choco", "dotnet", "nuget". Defaults to "choco" since YANuget is
# primarily deployed as a Chocolatey feed.
primary_client = "choco"      # YANUGET_PRIMARY_CLIENT

# ---------------------------------------------------------------------------
# Trusted proxies — who may set X-Forwarded-* / X-Real-IP.
#
# These headers are sent by the *client*, and two things depend on them: the
# base URL of every absolute package URL handed to NuGet clients, and the
# identity the rate limiter throttles. Honouring them from anyone lets a caller
# point restoring clients at a host of their choosing (directly, or by
# poisoning a shared cache in front of this server) and lets a rotating
# X-Forwarded-For walk straight through the throttle.
#
# So they are only honoured from a peer listed here; from anyone else they are
# stripped before any handler sees them. Entries may be an IP, a CIDR block,
# "private" (loopback + link-local + RFC1918/ULA — where reverse proxies
# actually live, and the default), or "*" to trust every peer.
#
# An empty list trusts nobody, which is right when this server faces the
# internet directly. Setting base_url pins the generated URLs regardless.
# ---------------------------------------------------------------------------
# YANUGET_TRUSTED_PROXIES (comma-separated) replaces this list entirely.
trusted_proxies = ["private"]

# ---------------------------------------------------------------------------
# Rate limiting — per-client-IP request throttling (brute-force mitigation).
#
# On by default with a generous limit so ordinary restores are unaffected while
# online API-key guessing is throttled. The client IP is taken from
# X-Forwarded-For / X-Real-IP when the peer is a trusted proxy (see
# trusted_proxies above) and otherwise the peer address. Tune up for very
# high-volume read traffic, or disable and rely on a reverse proxy. Exceeding
# the limit returns 429 with a Retry-After header.
# ---------------------------------------------------------------------------
[rate_limit]
enabled = true                # YANUGET_RATELIMIT_ENABLED
max_requests = 1000           # YANUGET_RATELIMIT_MAX_REQUESTS — per IP per window
window_secs = 60              # YANUGET_RATELIMIT_WINDOW_SECS

# ---------------------------------------------------------------------------
# Package retention — automatic pruning of old versions.
#
# Retention HARD-deletes versions (payload, sidecars and symbols), so it is
# off by default. A version is pruned when it is beyond the newest-N of its
# release channel OR older than max_age_days; the newest stable version (or
# newest pre-release, if there is no stable) is always kept.
# ---------------------------------------------------------------------------
[retention]
enabled = false               # YANUGET_RETENTION_ENABLED — master switch
prune_on_push = false         # YANUGET_RETENTION_PRUNE_ON_PUSH — prune after each push
interval_hours = 24           # YANUGET_RETENTION_INTERVAL_HOURS — background sweep (0 = off)

# Leave a limit unset to not apply it. At least one limit must be set for the
# sweep to do anything.
# keep_latest_stable = 10       # YANUGET_RETENTION_KEEP_LATEST_STABLE
# keep_latest_prerelease = 5    # YANUGET_RETENTION_KEEP_LATEST_PRERELEASE
# max_age_days = 180            # YANUGET_RETENTION_MAX_AGE_DAYS

# ---------------------------------------------------------------------------
# Feeds — host several NuGet feeds from one server.
#
# With NO [[feeds]] blocks (the default), a single implicit feed named
# "default" is served at the server root — the historical single-feed behaviour,
# using the global api_key / admin_api_key / allow_overwrite / retention above.
#
# With one or more [[feeds]], each feed is mounted under /{name}
# (e.g. /stable/v3/index.json) and the root serves a feed index. A package
# version can belong to several feeds at once; its payload and metadata are
# stored ONCE and referenced by each feed (no duplication on disk).
#
# Feeds are configured in TOML only — there are no YANUGET_* env vars for them.
#
# NOTE on the sub-tables below: a feed's `mirror`, `license_policy` and
# `retention` blocks attach to the **most recently declared** [[feeds]] entry
# and are written `[feeds.mirror]`, not `[feeds.<name>.mirror]`. The latter
# declares a table called `<name>` inside the feed and is rejected at startup.
# ---------------------------------------------------------------------------

# [[feeds]]
# name = "dev"                  # URL slug + database key; [A-Za-z0-9._-]+
# # api_key falls back to the global api_key when unset (push / "put").
# # read_api_key gates download/restore ("get"); unset = open. Accepted as an
# #   X-NuGet-ApiKey header OR the password of HTTP Basic credentials.
# # read_api_key = "downloaders"
# # admin_api_key falls back to the global admin_api_key (moderation / "delete").
# allow_overwrite = false       # falls back to global when unset
# hard_delete_enabled = false   # falls back to global when unset
# requires_approval = false     # true = incoming versions are pending until approved
# promotes_to = "stable"        # the next release ring (must name another feed)
#
#   [feeds.mirror]              # read-through cache of an upstream V3 feed
#   enabled = true
#   upstream = "https://api.nuget.org/v3/index.json"
#   timeout_secs = 30
#   # A mirror fetch is triggered by an ordinary (possibly anonymous) read, so
#   # it is bounded by default: at most this many versions of one package per
#   # miss, newest first. Set to a large number, or omit, to fetch everything.
#   max_versions_per_package = 50
#   # Cap on a single mirrored package. Unset inherits max_package_size_bytes.
#   # max_package_size_bytes = 5_000_000_000
#   # The resource URLs the mirror follows come from the upstream's own service
#   # index, so an upstream could aim them at this server's network or a cloud
#   # metadata endpoint. Private/loopback targets are refused unless you opt in
#   # because your upstream really is on the private network.
#   allow_private_upstream = false
#
#     # Credentials for an authenticated upstream (all optional). Set the
#     # username/password pair for HTTP Basic, token for a Bearer token, and/or
#     # headers for a custom header (e.g. a private-feed API key).
#     [feeds.mirror.auth]
#     # username = "ci"
#     # password = "secret"
#     # token = "ghp_xxx"
#     # headers = { "X-NuGet-ApiKey" = "upstream-key" }
#
# [[feeds]]
# name = "stable"
# requires_approval = true      # promoted/pushed versions wait for /admin approval
#
#   [feeds.license_policy]          # offline SPDX allow/deny (no network)
#   enabled = true
#   allowed = ["MIT", "Apache-2.0"] # if non-empty, license must match one
#   blocked = ["GPL-3.0-only"]      # always rejected, even if also allowed
#   allow_unlicensed = false        # reject packages that declare no license
#   action = "warn"                 # "warn" = accept + flag; "block" = reject
#
#   # Per-feed retention overrides the global [retention] for this feed.
#   [feeds.retention]
#   enabled = true
#   keep_latest_stable = 20
