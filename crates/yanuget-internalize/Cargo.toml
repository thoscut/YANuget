[package]
name = "yanuget-internalize"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
description = "Internalizes Chocolatey packages into a YANuget feed: captures what their scripts download, attaches the files, and pushes a copy that installs offline."
license = "MIT"
repository = "https://github.com/thoscut/yanuget"
homepage = "https://github.com/thoscut/yanuget"
readme = "README.md"
# Not released before its first version (`INT-10`–`INT-22` in ROADMAP.md).
publish = false

[[bin]]
name = "yanuget-internalize"
path = "src/main.rs"

[dependencies]
yanuget-pkg = { path = "../yanuget-pkg", version = "0.1.0", features = ["net"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }
