# yanuget-internalize configuration. Every setting is optional; shown here are
# the defaults, or an example where there is none.
#
# Each setting can also come from the environment: its TOML path in capitals,
# joined by `_`, after YANUGET_INTERNALIZE_. `[sandbox.kvm] capture_image` is
# YANUGET_INTERNALIZE_SANDBOX_KVM_CAPTURE_IMAGE. The environment wins over
# this file. The push key can come from a file instead:
# YANUGET_INTERNALIZE_TARGET_API_KEY_FILE=/run/credentials/…/push-key.
#
# Check a configuration with `yanuget-internalize -c this.toml config check`.

# Upstream packages and downloaded files, kept between runs.
cache_dir = "./cache"
# Scratch space of a run.
work_dir = "./work"
# One TOML file per package id with what the capture cannot find out: skip,
# package parameters, a replacement script, extra downloads, URL rewrites.
# overrides_dir = "./overrides"

[target]
# The intake feed (requires_approval = true) to push to, where its
# v3/index.json is. `plan` works without one; `run` does not.
# url = "https://nuget.example.com/intake/"
# A push key of that feed, and nothing more. Better from the environment or
# a key file than from here.
# api_key = ""
# One request to the feed; an attach gets a second more for every MiB.
timeout_secs = 300
# The file types the feed takes as attached files: the same list as the
# feed's own allowed_extensions. A download of any other type is reported, and
# the package needs an override.
allowed_extensions = ["exe", "msi", "msix", "msu", "zip", "7z", "cab"]

[upstream]
# A v2 feed, or a v3 service index (a URL ending in .json).
url = "https://community.chocolatey.org/api/v2/"
# Requests at a time; the community repository rate-limits heavy users. A 429
# or 503 is waited out (Retry-After, else a doubling backoff) and tried again.
concurrency = 2
# Connecting, any silence while the upstream answers, one metadata request.
timeout_secs = 60
# The largest package taken from the upstream.
max_package_bytes = 2147483648
# Allow URLs and redirects that lead to loopback, private or link-local
# addresses: for an upstream on the internal network.
allow_private = false
# An outbound proxy; without one, HTTP(S)_PROXY is ignored.
# proxy = "http://proxy.example.com:3128"
# Credentials, sent to the upstream's own scheme, host and port only, never
# to a CDN it redirects to. Basic (username and password) or a token.
# username = ""
# password = ""       # or YANUGET_INTERNALIZE_UPSTREAM_PASSWORD(_FILE)
# token = ""          # or YANUGET_INTERNALIZE_UPSTREAM_TOKEN(_FILE)

# [upstream.headers]
# X-Api-Key = ""

[downloads]
# The files captured scripts download: installers and archives from vendor
# hosts. Each is hashed with SHA-256 and with the algorithm the script
# declares; a declared checksum that does not match fails the package.
concurrency = 4
# Connecting, and any silence while a host sends.
timeout_secs = 60
# The largest file taken.
max_file_bytes = 8589934592
# How often a download cut off midway is resumed (or restarted, where the
# host cannot resume) before it fails.
resume_attempts = 5
# Hosts a download may reach although they are, or resolve to, loopback,
# private or link-local addresses. Package scripts are untrusted: without
# this, one could make the tool fetch from an internal host and publish the
# answer. As a variable: comma-separated.
allow_private_hosts = []
# An outbound proxy; without one, HTTP(S)_PROXY is ignored.
# proxy = "http://proxy.example.com:3128"

[sandbox]
# "kvm" (a Linux host with /dev/kvm) or "windows-container" (a Windows host).
backend = "kvm"
# Wall-clock limit of one capture.
timeout_secs = 1800
# Sandboxes at once.
max_parallel = 1
# The most a capture may write; more fails the package.
max_capture_bytes = 4194304

[sandbox.kvm]
# A path, or a name looked up in PATH.
qemu = "qemu-system-x86_64"
# The golden images (contrib/internalizer/, once it exists).
# capture_image = "/var/lib/yanuget-internalize/images/capture.qcow2"
# stock_image = "/var/lib/yanuget-internalize/images/stock.qcow2"
memory_mib = 4096
cpus = 2

[sandbox.windows_container]
# Pinned by digest.
# image = "registry.example.com/yanuget-internalize@sha256:…"
