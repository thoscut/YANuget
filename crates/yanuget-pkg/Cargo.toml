[package]
name = "yanuget-pkg"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "NuGet package handling shared by YANuget and its tools: versions and version ranges, .nuspec parsing, .nupkg reading."
license = "MIT"
repository = "https://github.com/thoscut/yanuget"
homepage = "https://github.com/thoscut/yanuget"
readme = "README.md"
keywords = ["nuget", "nupkg", "nuspec", "semver"]
categories = ["parser-implementations"]

[features]
default = []
# The upstream address policy: a reqwest DNS resolver that drops private,
# loopback and link-local answers. Off by default, since it brings reqwest.
net = ["dep:reqwest", "tokio/net"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip's `deflate-flate2` leaves flate2's backend to the application; this
# picks flate2's default pure-Rust one, as the server's own flate2 does.
flate2 = "1"
uuid = { version = "1", features = ["v4"] }
quick-xml = { version = "0.42", features = ["serialize"] }
# The URL type reqwest uses, to resolve the `@id`s of a NuGet v3 document.
url = "2"
reqwest = { version = "0.12", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
proptest = "1"
